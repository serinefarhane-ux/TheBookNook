<script>
   
    // Your JavaScript code for the stopwatch functionality would go here
    window.onload = function() {
        let minutes = 0;
        let seconds = 0;
        let tens = 0;
        let Interval;
        let appendMinutes = document.getElementById("hours");
        let appendSeconds = document.getElementById("minutes");
        let appendTens = document.getElementById("seconds");
        
        let startButton = document.getElementById("start");
        let stopButton = document.getElementById("stop");
        let resetButton = document.getElementById("reset");


        const startTimer = () =>{
            tens++;
            if(tens < 9){
                appendTens.innerHTML = "0" + tens;
            } else {
                appendTens.innerHTML = tens;
            }
            if(tens > 99) {
                seconds++;
                appendSeconds.innerHTML = "0" + seconds;
                tens = 0;
                appendTens.innerHTML = "0" + 0;
            }
            if(seconds > 9) {
                appendSeconds.innerHTML = seconds;
            }
            if(seconds > 59) {
                  minutes++;
                appendMinutes.innerHTML = "0" + minutes;
                seconds = 0;
                appendSeconds.innerHTML = "0" + 0;
            }
              

        };




        startButton.onclick = () => {
            clearInterval(Interval);
            Interval = setInterval(startTimer, 1000);
        };

        stopButton.onclick =() => {
            clearInterval(Interval);
        };
        resetButton.onclick = () => {
            clearInterval(Interval);
            tens = "00";
            seconds = "00";
            minutes = "00";
            appendTens.innerHTML = tens;
            appendSeconds.innerHTML = seconds;
            appendMinutes.innerHTML = minutes;
        };
        
    };
 alert("Be sure you are logged into Spotify to listen to the full tracks");
</script>
