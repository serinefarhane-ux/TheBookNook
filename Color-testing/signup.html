<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Sign Up and Login</title>
   <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class = "navbar">
    <nav>
      <ul>
        <li>
          <a href="home.html">◦ Home</a>
        </li>
        <li>
          <a href="cat.html">Book Recs</a>
        </li>
        <li>
          <a href="signup.html">Sign Up</a>
        </li>
      </ul>
    </nav>
  </div>
  <div class="auth-container">
    <h2>Create an Account</h2>
    <!-- Sign Up Form -->
    <form id="signup-form">
      <input type="text" id="signup-firstName" placeholder="First Name" required>
      <input type="text" id="signup-lastName" placeholder="Last Name" required>     
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <h2 style="margin-top: 40px;">Log In</h2>
    <!-- Login Form -->
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
  </div>

  <!-- Load Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase Logic Script -->
  <script>
    
    document.addEventListener('DOMContentLoaded', () => {
      const SUPABASE_URL = 'https://etbojtylbbsjfwphikoz.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_LZ-TtGJGQAh1XeUMvXzEsg_4UMTMdbK';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Handle Sign Up
      const signupForm = document.getElementById('signup-form');
      if (signupForm) {
        signupForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('signup-email').value;
          const password = document.getElementById('signup-password').value;

          const { data, error } = await supabase.auth.signUp({ email, password });
          
          if (error) {
            alert('Error: ' + error.message);
          } else {
            alert('Success! Check your Supabase dashboard users tab.');
          }
        });
      }

      // Handle Log In
      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value;
          const password = document.getElementById('login-password').value;

          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          
          if (error) {
            alert('Login Failed: ' + error.message);
          } else {
            alert('Successfully logged in!');
          }
        });
      }
    });
  </script>
</body>
</html>
